<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">


<section layout:fragment="contents" class="contents d-flex justify-content-center">
    <div class="feed">
        <div class="border">
            <h4 class="ml-2 mt-2 mb-2">samok</h4>
        </div>

        <div class="image-bord">
            <img class="image-contents" src="https://cdn.pixabay.com/photo/2025/11/29/16/26/nature-9985148_1280.jpg">
        </div>

        <div class="d-flex justify-content-between border reaction-bord align-items-center">
            <div>
                <button class="btn btn-style"><img class="sm-image-form" src="https://www.urbanbrush.net/web/wp-content/uploads/edd/2017/12/web-20171216234058563271-1560x1337.png" alt=""></button>
                <button class="btn btn-style"><img class="sm-image-form" src="https://img.icons8.com/ios7/1200/comments--v2.jpg" alt=""></button>
            </div>
            <button class="btn btn-style"><img class="sm-image-form" src="https://png.pngtree.com/png-vector/20190531/ourmid/pngtree-trash-bin-icon-png-image_1252303.jpg" alt=""></button>
        </div>

        <div class="border">
            <p class="ml-2"><b>감자</b><span class=""> 댓글내용어찌구</span></p>
            <p class="ml-2"><b>고구마</b><span class=""> 댓글내용저찌구</span></p>
        </div>

        <div class="write-comment-form d-flex">
            <input type="text" class="form-control" placeholder="댓글 내용을 입력하세요...">
            <button class="btn btn-style"><img width="30" src="https://cdn-icons-png.flaticon.com/512/6731/6731644.png"></button>
        </div>
    </div>
    <div class="add-contents d-flex">
        <button type="button" class="">+</button>
    </div>
</section>
