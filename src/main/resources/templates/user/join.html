<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">



        <section layout:fragment="contents" class="contents d-flex justify-content-center">
            <div class="user-box my-3 p-5 rounded-lg">
                <div class="d-flex justify-content-center mb-5">
                     <img width="80" height="80" src="https://cdn-icons-png.flaticon.com/512/125/125503.png">
                </div>
                <div class="d-flex justify-content-between">
                    <div>
                        <label>First name</label>
                        <input type="text" class="form-control form-control-sm">
                    </div>
                    <div>
                        <label>Last name</label>
                        <input type="text" class="form-control form-control-sm">
                    </div>
                </div>

                <div class="mt-3">
                    <label>E-mail</label><input type="text" class="form-control form-control-sm">
                </div>

                <div class="mt-3">
                    <label>ID</label>
                    <div class="d-flex">
                        <input type="text" class="form-control form-control-sm col-9 mr-3">
                        <button type="button" class="btn btn-sm btn-dark text-white" style="min-width: 70px;">중복확인</button>
                    </div>
                </div>

                <div class="mt-3">
                    <label>PW</label><input type="text" class="form-control form-control-sm">
                </div>

                <div class="mt-3">
                    <label>PW Check</label><input type="text" class="form-control form-control-sm">
                </div>

                <button type="button" class="btn btn-block btn-dark text-white mt-4">Join</button>
            </div>
        </section>
