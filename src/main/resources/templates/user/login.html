<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

<section layout:fragment="contents" class="contents d-flex justify-content-center">
    <div class="user-box my-3 p-5 rounded-lg">
        <div class="d-flex justify-content-center mb-5 mt-5">
            <img width="100" height="100" src="https://cdn-icons-png.flaticon.com/512/6423/6423924.png">
        </div>

        <form id="loginForm">
            <div class="mt-3">
                <label>ID</label><input type="text" class="form-control form-control-sm" id="idInput">
            </div>

            <div class="mt-3">
                <label>Password</label><input type="password" class="form-control form-control-sm" id="passwordInput">
            </div>

            <button type="submit" class="btn btn-block btn-dark text-white mt-4" id="loginBtn">Login</button>
        </form>

        <div class="mt-3 d-flex justify-content-end">
            <a href="/user/join">Sign in...</a>
        </div>

    </div>
</section>

<script layout:fragment="script">

    $("#loginForm").on("submit", function (e) {
        // form 태그가 요청을 하는 기능을 취소시키기
        // 해당 이벤트에 포함된 모든 기능을 취소한다
        e.preventDefault();



        let id = $("#idInput").val();
        let password = $("#passwordInput").val();

        if (id == "") {
            alert("아이디를 입력하세요")
            return ;
        }

        if (password == "") {
            alert("비밀번호를 입력하세요")
            return ;
        }

        alert("아이디 : " + id + " 비밀번호 : " + password);

        $.ajax({
            type: "post"
            , url: "/user/login-process"
            , data: {"loginId":id, "password":password}
            , success:function (response) {
                if (response.result == "success") {
                    location.href = "/home/feed";
                } else {
                    alert("아이디와 비밀번호를 확인해주세요")
                }
            }
            ,error:function () {
                alert("로그인 에러!")
            }
        })

    })

    $("#loginBtn").on("click", function () {
        let id = $("#idInput").val();
        let password = $("#passwordInput").val();

        if (id == "") {
            alert("아이디를 입력하세요")
            return ;
        }

        if (password == "") {
            alert("비밀번호를 입력하세요")
            return ;
        }

        alert("아이디 : " + id + " 비밀번호 : " + password);

        $.ajax({
            type: "post"
            , url: "/user/login-process"
            , data: {"loginId":id, "password":password}
            , success:function (response) {
                if (response.result == "success") {
                    location.href = "/home/feed";
                } else {
                    alert("아이디와 비밀번호를 확인해주세요")
                }
            }
            ,error:function () {
                alert("로그인 에러!")
            }
        })


    })
</script>
